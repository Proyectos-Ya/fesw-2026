# Override para desarrollar contra Supabase local en vez del Postgres del compose.
#
#   supabase start                                          # levanta Supabase
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.supabase.yml up -d     # levanta api + qdrant
#
# Qué cambia respecto del compose base:
#   - No se levanta el servicio `postgres`: la base la pone Supabase.
#   - La API llega a Supabase por `host.docker.internal`, porque Supabase corre
#     en su propia red de Docker y no en la de este compose.
#
# Producción usa el mismo mecanismo: DATABASE_URL apuntando al proyecto de
# Supabase. Solo cambia el valor.

services:
  api:
    # `!reset` borra la dependencia del compose base en vez de fusionarse con
    # ella; sin esto, Compose levantaría igual el Postgres local.
    depends_on: !reset null
    environment:
      # Puerto 54322: el Postgres de `supabase start`. El 54321 es la API REST.
      # Las credenciales del stack local son fijas y públicas por diseño.
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      QDRANT_HOST: qdrant
      QDRANT_HTTP_PORT: 6333
    extra_hosts:
      # En Linux no existe por defecto; en macOS y Windows Docker ya lo resuelve.
      - "host.docker.internal:host-gateway"

  postgres:
    # Un profile que nadie activa deja el servicio definido pero fuera de
    # `docker compose up`. Sin esto se levantaría un segundo Postgres, ocioso y
    # confuso: dos bases distintas escuchando a la vez.
    profiles:
      - sin-uso-con-supabase
