<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<title>ProyectosYa — Postula a la licitación correcta, hoy</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 32px; }
  .nav { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg-page) 86%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-subtle); }
  .navrow { display: flex; align-items: center; gap: 28px; height: 68px; }
  .navlinks { display: flex; gap: 26px; margin-left: auto; }
  .navlinks a { color: var(--text-muted); font-size: var(--text-sm); font-weight: 500; }
  .navlinks a:hover { color: var(--text-strong); text-decoration: none; }
  section { position: relative; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script>window.DS = window.ProyectosYaDesignSystem_1dd038;</script>
</head>
<body><div id="root"></div>
<script type="text/babel">
const { Button, Badge, Card, MatchMeter, Tag, Icon, Avatar } = window.DS;

function Nav() {
  return (
    <div className="nav"><div className="wrap navrow">
      <img src="../../assets/logo-wordmark.svg" alt="ProyectosYa" style={{ height: 30 }} />
      <div className="navlinks">
        <a href="#como">Cómo funciona</a><a href="#match">Matching IA</a><a href="#precios">Precios</a>
      </div>
      <div style={{ display: 'flex', gap: 10 }}>
        <Button variant="ghost" size="sm">Ingresar</Button>
        <Button variant="primary" size="sm">Crear perfil gratis</Button>
      </div>
    </div></div>
  );
}

function Hero() {
  return (
    <section><div className="wrap" style={{ display: 'grid', gridTemplateColumns: '1fr 0.85fr', gap: 48, alignItems: 'center', padding: '72px 32px 64px' }}>
      <div>
        <Badge tone="coral" style={{ marginBottom: 18 }}>Para MiPymes en ChileCompra</Badge>
        <h1 style={{ fontSize: 'var(--text-6xl)', lineHeight: 1.02, letterSpacing: '-0.03em', margin: '0 0 18px' }}>
          Postula a la licitación <span style={{ color: 'var(--coral-500)' }}>correcta</span>, hoy.
        </h1>
        <p style={{ fontSize: 'var(--text-xl)', color: 'var(--text-muted)', maxWidth: 460, margin: '0 0 28px' }}>
          ProyectosYa lee tu perfil y lo cruza con Compra Ágil para mostrarte solo las oportunidades que de verdad calzan con tu empresa.
        </p>
        <div style={{ display: 'flex', gap: 12, marginBottom: 22 }}>
          <Button variant="accent" size="lg" iconRight={<Icon name="arrow-right" size={18} />}>Crear mi perfil</Button>
          <Button variant="secondary" size="lg" iconLeft={<Icon name="play-circle" size={18} />}>Ver cómo funciona</Button>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, color: 'var(--text-subtle)', fontSize: 'var(--text-sm)' }}>
          <Icon name="check-circle-2" size={16} color="var(--teal-500)" /> Sin tarjeta · Listo en 5 minutos
        </div>
      </div>
      <HeroCard />
    </div></section>
  );
}

function HeroCard() {
  return (
    <div style={{ position: 'relative' }}>
      <Card padding={22} elevation="lg" style={{ position: 'relative', zIndex: 2 }}>
        <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start' }}>
          <MatchMeter value={94} size="lg" />
          <div style={{ flex: 1 }}>
            <Badge tone="teal" style={{ marginBottom: 8 }}>Compra Ágil</Badge>
            <div style={{ fontFamily: 'var(--font-display)', fontWeight: 600, fontSize: 'var(--text-lg)', color: 'var(--text-strong)', lineHeight: 1.2 }}>Servicios de aseo y mantención municipal</div>
            <div style={{ fontSize: 'var(--text-sm)', color: 'var(--text-muted)', marginTop: 4 }}>Municipalidad de Ñuñoa</div>
          </div>
        </div>
        <div style={{ marginTop: 16, padding: 14, background: 'var(--teal-50)', border: '1px solid var(--teal-200)', borderRadius: 'var(--radius-md)' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontWeight: 600, color: 'var(--teal-700)', fontSize: 'var(--text-sm)', marginBottom: 6 }}>
            <Icon name="sparkles" size={16} /> Por qué calza contigo
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6, fontSize: 'var(--text-sm)', color: 'var(--text-body)' }}>
            <span><Icon name="check" size={14} color="var(--green-600)" style={{ marginRight: 6 }} />Tu rubro coincide exactamente</span>
            <span><Icon name="check" size={14} color="var(--green-600)" style={{ marginRight: 6 }} />4 contratos similares adjudicados</span>
          </div>
        </div>
      </Card>
      <div style={{ position: 'absolute', right: -18, bottom: -22, zIndex: 1 }}>
        <Card padding={14} elevation="md" style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <Avatar name="Camila Soto" size="sm" />
          <div style={{ fontSize: 'var(--text-sm)' }}><b style={{ color: 'var(--text-strong)' }}>+8 nuevas</b> <span style={{ color: 'var(--text-muted)' }}>esta semana</span></div>
        </Card>
      </div>
    </div>
  );
}

function Step({ n, icon, title, body }) {
  return (
    <Card padding={24} style={{ flex: 1 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 14 }}>
        <span style={{ width: 44, height: 44, borderRadius: 'var(--radius-md)', background: 'var(--teal-50)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>
          <Icon name={icon} size={22} color="var(--teal-600)" />
        </span>
        <span style={{ fontFamily: 'var(--font-mono)', fontSize: 'var(--text-sm)', color: 'var(--text-subtle)' }}>0{n}</span>
      </div>
      <h3 style={{ fontSize: 'var(--text-xl)', margin: '0 0 8px' }}>{title}</h3>
      <p style={{ color: 'var(--text-muted)', margin: 0, fontSize: 'var(--text-base)', lineHeight: 1.55 }}>{body}</p>
    </Card>
  );
}

function Como() {
  return (
    <section id="como" style={{ padding: '64px 0' }}><div className="wrap">
      <div className="eyebrow" style={{ marginBottom: 10 }}>Cómo funciona</div>
      <h2 style={{ fontSize: 'var(--text-4xl)', margin: '0 0 36px', maxWidth: 560 }}>De tu perfil a la postulación, en tres pasos.</h2>
      <div style={{ display: 'flex', gap: 20 }}>
        <Step n={1} icon="building-2" title="Arma tu perfil" body="Cuéntanos tu giro, rubros y experiencia. La IA construye un perfil inteligente de tu empresa." />
        <Step n={2} icon="sparkles" title="Recibe tus matches" body="Cruzamos miles de licitaciones de Compra Ágil y te mostramos solo las que calzan contigo." />
        <Step n={3} icon="send" title="Postula con confianza" body="Revisa el análisis de compatibilidad, cubre tus brechas y postula sin perder tiempo." />
      </div>
    </div></section>
  );
}

function Match() {
  return (
    <section id="match" style={{ background: 'var(--bg-sunken)', padding: '72px 0' }}><div className="wrap" style={{ display: 'grid', gridTemplateColumns: '0.9fr 1.1fr', gap: 56, alignItems: 'center' }}>
      <div style={{ display: 'flex', justifyContent: 'center' }}>
        <div style={{ position: 'relative', width: 260, height: 260, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <MatchMeter value={94} size="lg" style={{ transform: 'scale(2.1)' }} showValue={true} />
        </div>
      </div>
      <div>
        <div className="eyebrow" style={{ marginBottom: 10 }}>Matching semántico con IA</div>
        <h2 style={{ fontSize: 'var(--text-4xl)', margin: '0 0 16px' }}>No más leer cientos de licitaciones a mano.</h2>
        <p style={{ fontSize: 'var(--text-lg)', color: 'var(--text-muted)', margin: '0 0 22px' }}>
          Nuestro modelo entiende el contenido de cada licitación y lo compara con tu empresa: rubro, experiencia, monto y ubicación. Cada oportunidad llega con un puntaje de compatibilidad claro.
        </p>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
          <Tag iconLeft={<Icon name="target" size={15} />}>Rubro exacto</Tag>
          <Tag iconLeft={<Icon name="trending-up" size={15} />}>Experiencia</Tag>
          <Tag iconLeft={<Icon name="map-pin" size={15} />}>Ubicación</Tag>
          <Tag iconLeft={<Icon name="shield-check" size={15} />}>Requisitos</Tag>
        </div>
      </div>
    </div></section>
  );
}

function Stats() {
  const items = [['+12.000', 'licitaciones analizadas al mes'], ['5 min', 'para crear tu perfil'], ['94%', 'precisión del match promedio'], ['MiPymes', 'es para quienes lo construimos']];
  return (
    <section style={{ padding: '56px 0' }}><div className="wrap" style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 24 }}>
      {items.map(([v, l]) => (
        <div key={l}>
          <div style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 'var(--text-4xl)', color: 'var(--teal-600)', letterSpacing: '-0.02em' }}>{v}</div>
          <div style={{ color: 'var(--text-muted)', fontSize: 'var(--text-sm)', marginTop: 4 }}>{l}</div>
        </div>
      ))}
    </div></section>
  );
}

function CTA() {
  return (
    <section style={{ padding: '24px 0 72px' }}><div className="wrap">
      <div style={{ background: 'var(--teal-600)', borderRadius: 'var(--radius-2xl)', padding: '52px 56px', position: 'relative', overflow: 'hidden' }}>
        <div style={{ position: 'relative', zIndex: 2, maxWidth: 560 }}>
          <h2 style={{ color: 'var(--warm-50)', fontSize: 'var(--text-5xl)', margin: '0 0 14px', letterSpacing: '-0.02em' }}>Menos papeleo.<br/>Más proyectos ganados.</h2>
          <p style={{ color: 'var(--teal-100)', fontSize: 'var(--text-lg)', margin: '0 0 26px' }}>Crea tu perfil gratis y recibe tus primeras licitaciones compatibles hoy mismo.</p>
          <Button variant="accent" size="lg" iconRight={<Icon name="arrow-right" size={18} />}>Empezar gratis</Button>
        </div>
        <div style={{ position: 'absolute', right: -40, top: -40, width: 320, height: 320, borderRadius: '50%', background: 'var(--teal-500)', opacity: 0.5 }} />
        <div style={{ position: 'absolute', right: 80, bottom: -80, width: 220, height: 220, borderRadius: '50%', background: 'var(--teal-700)', opacity: 0.5 }} />
      </div>
    </div></section>
  );
}

function Footer() {
  return (
    <footer style={{ borderTop: '1px solid var(--border-subtle)', padding: '28px 0' }}><div className="wrap" style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
      <img src="../../assets/logo-wordmark.svg" alt="ProyectosYa" style={{ height: 24 }} />
      <span style={{ color: 'var(--text-subtle)', fontSize: 'var(--text-sm)', marginLeft: 'auto' }}>© 2026 ProyectosYa · Hecho en Chile</span>
    </div></footer>
  );
}

function Landing() {
  return (<div><Nav /><Hero /><Como /><Match /><Stats /><CTA /><Footer /></div>);
}

function mount(){ if(!window.DS){ return setTimeout(mount, 40); }
  ReactDOM.createRoot(document.getElementById('root')).render(<Landing />);
  setTimeout(() => window.lucide && window.lucide.createIcons(), 200);
}
mount();
</script>
</body></html>
