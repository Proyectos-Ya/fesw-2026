<!-- @dsCard group="Colors" viewport="700x150" name="Accent · Coral" subtitle="Orange-red accent scale 50–900" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--bg-page)}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
  .sw{flex:1;height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;font-family:var(--font-mono);font-size:11px}
  .sw small{font-size:10px;opacity:.75}
  .lab{display:flex;justify-content:space-between;margin-top:10px;font-family:var(--font-sans);font-size:12px;color:var(--text-muted)}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--coral-50);color:var(--coral-900)">50</div>
    <div class="sw" style="background:var(--coral-100);color:var(--coral-900)">100</div>
    <div class="sw" style="background:var(--coral-200);color:var(--coral-900)">200</div>
    <div class="sw" style="background:var(--coral-300);color:var(--coral-900)">300</div>
    <div class="sw" style="background:var(--coral-400);color:#fff">400</div>
    <div class="sw" style="background:var(--coral-500);color:#fff">500<small>· accent</small></div>
    <div class="sw" style="background:var(--coral-600);color:#fff">600</div>
    <div class="sw" style="background:var(--coral-700);color:#fff">700</div>
    <div class="sw" style="background:var(--coral-800);color:#fff">800</div>
    <div class="sw" style="background:var(--coral-900);color:#fff">900</div>
  </div>
  <div class="lab"><span>--coral-500 · #E0552F</span><span>Energy · action · "Ya"</span></div>
</body></html>
