<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="xs → 5xl, display & text roles" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:22px;background:var(--bg-page)}
  .row{display:flex;align-items:baseline;gap:16px;padding:7px 0;border-bottom:1px dashed var(--border-subtle)}
  .row:last-child{border:0}
  .name{width:70px;font-family:var(--font-mono);font-size:11px;color:var(--text-subtle);flex:none}
  .spec{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-subtle);flex:none}
  .s{font-family:var(--font-display);color:var(--text-strong);font-weight:600;letter-spacing:-0.02em;line-height:1.1}
  .b{font-family:var(--font-sans);color:var(--text-body);font-weight:400}
</style></head>
<body>
  <div class="row"><span class="name">5xl</span><span class="s" style="font-size:48px">Compra Ágil</span><span class="spec">48 / display</span></div>
  <div class="row"><span class="name">3xl</span><span class="s" style="font-size:30px">Match inteligente</span><span class="spec">30 / display</span></div>
  <div class="row"><span class="name">xl</span><span class="s" style="font-size:20px">Tu perfil, leído por IA</span><span class="spec">20 / display</span></div>
  <div class="row"><span class="name">base</span><span class="b" style="font-size:16px">Cuerpo de texto para descripciones y detalle.</span><span class="spec">16 / text</span></div>
  <div class="row"><span class="name">sm</span><span class="b" style="font-size:14px">Metadatos, etiquetas y apoyo.</span><span class="spec">14 / text</span></div>
  <div class="row"><span class="name">xs</span><span class="b" style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--primary)">Eyebrow / overline</span><span class="spec">12 / caps</span></div>
</body></html>
