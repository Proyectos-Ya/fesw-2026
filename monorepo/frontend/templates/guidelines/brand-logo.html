<!-- @dsCard group="Brand" viewport="700x200" name="Logo lockups" subtitle="Wordmark, on-teal, and mark — clear space = cap height" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:22px;background:var(--bg-page);font-family:var(--font-sans)}
  .grid{display:flex;gap:18px;align-items:stretch}
  .cell{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:22px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-xs)}
  .teal{background:var(--teal-600);border-color:var(--teal-700)}
  .cap{font-size:11px;color:var(--text-subtle);text-align:center;margin-top:8px}
</style></head>
<body>
  <div class="grid">
    <div style="flex:2"><div class="cell"><img src="../assets/logo-wordmark.svg" height="40"></div><div class="cap">Primary wordmark</div></div>
    <div style="flex:2"><div class="cell teal"><img src="../assets/logo-wordmark-onteal.svg" height="40"></div><div class="cap">On teal</div></div>
    <div style="flex:1"><div class="cell"><img src="../assets/logo-mark.svg" height="56"></div><div class="cap">App mark</div></div>
  </div>
</body></html>
