<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:22px;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-body)}
  .tag{font-family:var(--font-display);font-weight:600;font-size:26px;letter-spacing:-0.02em;color:var(--text-strong);margin:0 0 16px}
  .tag em{font-style:normal;color:var(--coral-500)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .c{border-radius:var(--radius-md);padding:12px 14px;font-size:13px;line-height:1.45}
  .yes{background:var(--teal-50);border:1px solid var(--teal-200)}
  .no{background:var(--coral-50);border:1px solid var(--coral-200)}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
</style></head>
<body>
  <p class="tag">Menos papeleo. Más <em>proyectos ganados</em>.</p>
  <div class="cols">
    <div class="c yes"><div class="lbl" style="color:var(--teal-700)">Así sí</div>"Encontramos 8 licitaciones que calzan con tu giro esta semana."</div>
    <div class="c no"><div class="lbl" style="color:var(--coral-700)">Así no</div>"El sistema ha procesado satisfactoriamente las oportunidades disponibles."</div>
  </div>
</body></html>
