<!-- @dsCard group="Type" viewport="700x170" name="Display · Bricolage Grotesque" subtitle="Headlines — fresh, characterful, tight tracking" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:22px;background:var(--bg-page)}
  .big{font-family:var(--font-display);font-weight:600;font-size:46px;line-height:1.05;letter-spacing:-0.02em;color:var(--text-strong);margin:0}
  .big em{font-style:normal;color:var(--coral-500)}
  .meta{margin-top:14px;display:flex;gap:18px;font-family:var(--font-mono);font-size:11px;color:var(--text-subtle)}
</style></head>
<body>
  <p class="big">Postula a la licitación <em>correcta</em>, hoy.</p>
  <div class="meta"><span>Bricolage Grotesque</span><span>600 / 700</span><span>tracking -0.02em</span><span>--font-display</span></div>
</body></html>
