<!-- @dsCard group="Colors" viewport="700x150" name="Warm neutrals" subtitle="Off-white surfaces to warm near-black ink" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--bg-page)}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border-subtle)}
  .sw{flex:1;height:84px;display:flex;align-items:flex-end;padding:8px 10px;font-family:var(--font-mono);font-size:11px}
  .lab{display:flex;justify-content:space-between;margin-top:10px;font-family:var(--font-sans);font-size:12px;color:var(--text-muted)}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--warm-50);color:var(--warm-900)">50</div>
    <div class="sw" style="background:var(--warm-100);color:var(--warm-900)">100</div>
    <div class="sw" style="background:var(--warm-200);color:var(--warm-900)">200</div>
    <div class="sw" style="background:var(--warm-300);color:var(--warm-900)">300</div>
    <div class="sw" style="background:var(--warm-400);color:#fff">400</div>
    <div class="sw" style="background:var(--warm-500);color:#fff">500</div>
    <div class="sw" style="background:var(--warm-600);color:#fff">600</div>
    <div class="sw" style="background:var(--warm-700);color:#fff">700</div>
    <div class="sw" style="background:var(--warm-800);color:#fff">800</div>
    <div class="sw" style="background:var(--warm-900);color:#fff">900</div>
  </div>
  <div class="lab"><span>--warm-50 #FBF8F3 → --warm-900 #1B1814</span><span>Page · ink · borders</span></div>
</body></html>
