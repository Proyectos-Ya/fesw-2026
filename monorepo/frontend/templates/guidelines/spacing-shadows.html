<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation / shadows" subtitle="Warm-tinted, soft — xs → xl" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:26px 22px;background:var(--bg-page);font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
  .grid{display:flex;gap:24px;align-items:flex-end}
  .b{display:flex;flex-direction:column;align-items:center;gap:12px}
  .sq{width:84px;height:64px;background:var(--surface-card);border-radius:var(--radius-md)}
</style></head>
<body>
  <div class="grid">
    <div class="b"><div class="sq" style="box-shadow:var(--shadow-xs)"></div>xs</div>
    <div class="b"><div class="sq" style="box-shadow:var(--shadow-sm)"></div>sm</div>
    <div class="b"><div class="sq" style="box-shadow:var(--shadow-md)"></div>md</div>
    <div class="b"><div class="sq" style="box-shadow:var(--shadow-lg)"></div>lg</div>
    <div class="b"><div class="sq" style="box-shadow:var(--shadow-xl)"></div>xl</div>
    <div class="b"><div class="sq" style="box-shadow:var(--shadow-teal)"></div>teal</div>
  </div>
</body></html>
