<!-- @dsCard group="Colors" viewport="700x150" name="Primary · Teal" subtitle="Brand primary scale 50–900" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--bg-page)}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
  .sw{flex:1;height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;font-family:var(--font-mono);font-size:11px}
  .sw small{font-size:10px;opacity:.75}
  .lab{display:flex;justify-content:space-between;margin-top:10px;font-family:var(--font-sans);font-size:12px;color:var(--text-muted)}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--teal-50);color:var(--teal-900)">50</div>
    <div class="sw" style="background:var(--teal-100);color:var(--teal-900)">100</div>
    <div class="sw" style="background:var(--teal-200);color:var(--teal-900)">200</div>
    <div class="sw" style="background:var(--teal-300);color:var(--teal-900)">300</div>
    <div class="sw" style="background:var(--teal-400);color:#fff">400</div>
    <div class="sw" style="background:var(--teal-500);color:#fff">500<small>· primary</small></div>
    <div class="sw" style="background:var(--teal-600);color:#fff">600</div>
    <div class="sw" style="background:var(--teal-700);color:#fff">700</div>
    <div class="sw" style="background:var(--teal-800);color:#fff">800</div>
    <div class="sw" style="background:var(--teal-900);color:#fff">900</div>
  </div>
  <div class="lab"><span>--teal-500 · #0E8580</span><span>Trust · clarity · intelligence</span></div>
</body></html>
