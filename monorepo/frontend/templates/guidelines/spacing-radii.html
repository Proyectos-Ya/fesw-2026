<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Friendly, soft — xs → 2xl + pill" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:22px;background:var(--bg-page);font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
  .grid{display:flex;gap:16px;align-items:flex-end}
  .b{display:flex;flex-direction:column;align-items:center;gap:8px}
  .sq{width:72px;height:72px;background:var(--surface-card);border:1.5px solid var(--teal-400);box-shadow:var(--shadow-sm)}
</style></head>
<body>
  <div class="grid">
    <div class="b"><div class="sq" style="border-radius:var(--radius-xs)"></div>xs · 4</div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-sm)"></div>sm · 8</div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-md)"></div>md · 12</div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-lg)"></div>lg · 16</div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-xl)"></div>xl · 22</div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-2xl)"></div>2xl · 32</div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-pill)"></div>pill</div>
  </div>
</body></html>
