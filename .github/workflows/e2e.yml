name: E2E Tests (Playwright)

# Mismas versiones fijadas que ci.yml (ver el encabezado de ese archivo).

on:
  workflow_dispatch:
    inputs:
      grep_filter:
        description: 'Filtro de pruebas (ej. @smoke o dejar vacío para todas)'
        required: false
        default: '@smoke'
  schedule:
    # Ejecución programada nocturna de la suite completa (04:00 UTC)
    - cron: '0 4 * * *'

jobs:
  playwright:
    name: Pruebas End-to-End
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monorepo/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.3.0
          run_install: false

      - name: Configurar Node.js (versión de .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: monorepo/frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: monorepo/frontend/pnpm-lock.yaml

      - name: Instalar dependencias frontend
        run: pnpm install --frozen-lockfile

      - name: Instalar navegadores de Playwright con dependencias
        run: pnpm exec playwright install --with-deps chromium

      - name: Configurar Python 3.12.14 para el Backend y Seeders
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
          cache: 'pip'
          cache-dependency-path: monorepo/backend/requirements.txt

      - name: Instalar dependencias backend
        run: pip install -r ../backend/requirements.txt

      - name: Ejecutar pruebas Playwright
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          BACKEND_ORIGIN: http://127.0.0.1:8000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: clave-publicable-de-pruebas
        run: |
          FILTER="${{ github.event.inputs.grep_filter || '@smoke' }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pnpm exec playwright test
          else
            pnpm exec playwright test --grep "$FILTER"
          fi

      - name: Subir reporte de Playwright si hay fallos
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: monorepo/frontend/playwright-report/
          retention-days: 7
