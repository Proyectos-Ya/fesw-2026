name: E2E Tests (Playwright)

on:
  workflow_dispatch:
    inputs:
      grep_filter:
        description: 'Filtro de pruebas (ej. @smoke o dejar vacío para todas)'
        required: false
        default: '@smoke'
  schedule:
    # Ejecución programada nocturna de la suite completa (04:00 UTC)
    - cron: '0 4 * * *'

jobs:
  playwright:
    name: Pruebas End-to-End
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monorepo/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: monorepo/frontend/pnpm-lock.yaml

      - name: Instalar dependencias frontend
        run: pnpm install --frozen-lockfile

      - name: Instalar navegadores de Playwright con dependencias
        run: pnpm exec playwright install --with-deps chromium

      - name: Configurar Python 3.12 para el Backend y Seeders
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: monorepo/backend/requirements.txt

      - name: Instalar dependencias backend
        run: |
          python -m pip install --upgrade pip
          pip install -r ../backend/requirements.txt

      - name: Ejecutar pruebas Playwright
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          BACKEND_ORIGIN: http://127.0.0.1:8000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: clave-publicable-de-pruebas
        run: |
          FILTER="${{ github.event.inputs.grep_filter || '@smoke' }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pnpm exec playwright test
          else
            pnpm exec playwright test --grep "$FILTER"
          fi

      - name: Subir reporte de Playwright si hay fallos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: monorepo/frontend/playwright-report/
          retention-days: 7
