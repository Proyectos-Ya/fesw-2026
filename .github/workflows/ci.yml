name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # FASE 1: BUILDING (Frontend y Backend en paralelo)
  # ============================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monorepo/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: monorepo/frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Linter (ESLint)
        run: pnpm run lint

      - name: Verificacion de tipos estricta (no any)
        run: pnpm exec tsc --noEmit

      - name: Compilar Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: clave-de-build
        run: pnpm run build

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monorepo/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: monorepo/backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar sintaxis de Python
        run: python -m compileall app/

  # ============================================================
  # FASE 2: TESTING EN PARALELO (Requiere que ambos builds pasen)
  # ============================================================
  test-unit-frontend:
    name: Tests Unitarios Frontend
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monorepo/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: monorepo/frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar pruebas unitarias (Vitest)
        run: pnpm run test

  test-unit-backend:
    name: Tests Unitarios Backend y Alembic
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monorepo/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: monorepo/backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Chequeo de una sola cabeza de Alembic
        run: |
          n=$(alembic heads | grep -c '(head)')
          if [ "$n" -ne 1 ]; then
            echo "::error::Hay $n cabezas de Alembic. Resolver antes de mergear (ver AGENTS.md, seccion 3)."
            alembic heads
            exit 1
          fi

      - name: Pruebas unitarias de dominio y aplicacion (pytest)
        run: pytest tests/unit/ -v

  test-e2e:
    name: Tests E2E Criticos (Playwright)
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monorepo/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: monorepo/frontend/pnpm-lock.yaml

      - name: Instalar dependencias frontend
        run: pnpm install --frozen-lockfile

      - name: Instalar navegadores Playwright
        run: pnpm exec playwright install --with-deps chromium

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: monorepo/backend/requirements.txt

      - name: Instalar dependencias backend para seeders
        run: |
          python -m pip install --upgrade pip
          pip install -r ../backend/requirements.txt

      - name: Ejecutar pruebas E2E de humo
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          BACKEND_ORIGIN: http://127.0.0.1:8000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: clave-publicable-de-pruebas
        run: pnpm exec playwright test --grep "@smoke"

      - name: Subir reporte de Playwright si hay fallos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: monorepo/frontend/playwright-report/
          retention-days: 7

  # ============================================================
  # FASE 3: DEPLOY (Solo en push a develop o main si todo pasa)
  # ============================================================
  deploy-railway:
    name: Deploy Backend (Railway)
    needs: [test-unit-frontend, test-unit-backend, test-e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Deploy Webhook de Railway
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            curl -X POST "${{ secrets.RAILWAY_PROD_DEPLOY_WEBHOOK }}"
          else
            curl -X POST "${{ secrets.RAILWAY_STAGING_DEPLOY_WEBHOOK }}"
          fi

  deploy-vercel:
    name: Deploy Frontend (Vercel)
    needs: [test-unit-frontend, test-unit-backend, test-e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monorepo/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: monorepo/frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Desplegar en Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            pnpm exec vercel pull --yes --environment=production --token=$VERCEL_TOKEN
            pnpm exec vercel build --prod --token=$VERCEL_TOKEN
            pnpm exec vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
          else
            pnpm exec vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
            pnpm exec vercel build --token=$VERCEL_TOKEN
            pnpm exec vercel deploy --prebuilt --token=$VERCEL_TOKEN
          fi
