name: CI/CD Pipeline

# Versiones fijadas a propósito, para que un run de hoy y uno de dentro de un mes
# instalen lo mismo:
# - Acciones: por SHA de commit (un tag se puede mover), con la versión al lado.
# - Node: `monorepo/frontend/.nvmrc`. pnpm: igual que `packageManager` en package.json.
# - Python: el mismo parche que la imagen del Dockerfile.
# - Dependencias: `pnpm-lock.yaml` en el frontend y `==` en los requirements del backend.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # FASE 1: BUILDING (Frontend y Backend en paralelo)
  # ============================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monorepo/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.3.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: monorepo/frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: monorepo/frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Linter (ESLint)
        run: pnpm run lint

      - name: Verificacion de tipos estricta (no any)
        run: pnpm exec tsc --noEmit

      - name: Compilar Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: clave-de-build
          BACKEND_ORIGIN: http://127.0.0.1:8000
        run: pnpm run build

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monorepo/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
          cache: 'pip'
          cache-dependency-path: monorepo/backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar sintaxis de Python
        run: python -m compileall app/

  # ============================================================
  # FASE 2: TESTING EN PARALELO (Requiere que ambos builds pasen)
  # ============================================================
  test-unit-frontend:
    name: Tests Unitarios Frontend
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monorepo/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.3.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: monorepo/frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: monorepo/frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar pruebas unitarias (Vitest)
        run: pnpm run test

  test-unit-backend:
    name: Tests Unitarios Backend y Alembic
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monorepo/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
          cache: 'pip'
          cache-dependency-path: |
            monorepo/backend/requirements.txt
            monorepo/backend/requirements-test.txt

      - name: Instalar dependencias
        run: pip install -r requirements-test.txt

      - name: Chequeo de una sola cabeza de Alembic
        run: |
          n=$(alembic heads | grep -c '(head)')
          if [ "$n" -ne 1 ]; then
            echo "::error::Hay $n cabezas de Alembic. Resolver antes de mergear (ver AGENTS.md, seccion 3)."
            alembic heads
            exit 1
          fi

      - name: Pruebas unitarias de dominio y aplicacion (pytest)
        run: pytest tests/unit/ -v -m "not integration and not network"

  test-e2e:
    name: Tests E2E Criticos (Playwright)
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monorepo/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.3.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: monorepo/frontend/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: monorepo/frontend/pnpm-lock.yaml

      - name: Instalar dependencias frontend
        run: pnpm install --frozen-lockfile

      - name: Instalar navegadores Playwright
        run: pnpm exec playwright install --with-deps chromium

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
          cache: 'pip'
          cache-dependency-path: monorepo/backend/requirements.txt

      - name: Instalar dependencias backend para seeders
        run: pip install -r ../backend/requirements.txt

      - name: Ejecutar pruebas E2E de humo
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          BACKEND_ORIGIN: http://127.0.0.1:8000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: clave-publicable-de-pruebas
        run: pnpm exec playwright test --grep "@smoke"

      - name: Subir reporte de Playwright si hay fallos
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: monorepo/frontend/playwright-report/
          retention-days: 7

  # ============================================================
  # FASE 3: DEPLOY (Solo en push a develop o main si todo pasa)
  # ============================================================
  # El backend NO se despliega desde aquí: Railway tiene el auto-deploy por rama
  # (`main` -> production, `develop` -> dev test) con "Wait for CI", así que
  # despliega solo cuando este workflow termina en verde para ese commit.
  # Agregar aquí un job que despliegue a Railway provocaría un doble deploy.
  deploy-vercel:
    name: Deploy Frontend (Vercel)
    needs: [test-unit-frontend, test-unit-backend, test-e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.3.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: monorepo/frontend/.nvmrc

      # Se corre desde la raíz del repo: el proyecto de Vercel tiene
      # `monorepo/frontend` como root directory y `vercel build` entra solo.
      #
      # develop: con la integración de Git, Vercel movía sola la URL de la rama
      # (fesw-2026-git-develop-...) al último deploy. Un deploy por CLI solo crea
      # una URL única, así que el alias se reasigna explícitamente.
      - name: Desplegar en Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx -y vercel@59.16.0 pull --yes --environment=production --token=$VERCEL_TOKEN
            npx -y vercel@59.16.0 build --prod --token=$VERCEL_TOKEN
            npx -y vercel@59.16.0 deploy --prebuilt --prod --token=$VERCEL_TOKEN
          else
            npx -y vercel@59.16.0 pull --yes --environment=preview --token=$VERCEL_TOKEN
            npx -y vercel@59.16.0 build --token=$VERCEL_TOKEN
            url=$(npx -y vercel@59.16.0 deploy --prebuilt --token=$VERCEL_TOKEN)
            echo "Deploy de preview: $url"
            npx -y vercel@59.16.0 alias set "$url" fesw-2026-git-develop-benjaminulloaf-5015s-projects.vercel.app --token=$VERCEL_TOKEN
          fi

  # ============================================================
  # FASE 4: INFORME DE IMPACTO Y METRICAS DE CALIDAD
  # ============================================================
  metrics-summary:
    name: Informe de Impacto
    needs: [build-frontend, build-backend, test-unit-frontend, test-unit-backend, test-e2e, deploy-vercel]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Generar Reporte de Impacto en GitHub Step Summary
        run: |
          echo "## Informe de Metricas e Impacto del Pipeline de CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Consolidado de calidad, cobertura y despliegue para la rama: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Indicador de Calidad | Ambito evaluado | Resultado |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Frontend | Next.js 16 + TypeScript estricto (no any) | ${{ needs.build-frontend.result == 'success' && '[OK] Compilado' || '[FALLO]' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Backend | Sintaxis Python 3.12 (compileall app/) | ${{ needs.build-backend.result == 'success' && '[OK] Compilado' || '[FALLO]' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests Unitarios Frontend | Vitest (Hooks, Componentes y Servicios) | ${{ needs.test-unit-frontend.result == 'success' && '[OK] Exitoso' || '[FALLO]' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests Unitarios Backend | Pytest (Dominio, Casos de Uso y Routers) | ${{ needs.test-unit-backend.result == 'success' && '[OK] Exitoso' || '[FALLO]' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integridad Base de Datos | Alembic (1 sola cabeza garantizada) | ${{ needs.test-unit-backend.result == 'success' && '[OK] Lineal' || '[FALLO]' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests E2E de Humo | Playwright con Chromium Headless | ${{ needs.test-e2e.result == 'success' && '[OK] Pasaron' || (needs.test-e2e.result == 'skipped' && '[OMITIDO]' || '[FALLO]') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Despliegue Backend | Railway (${{ github.ref == 'refs/heads/main' && 'Produccion' || 'Staging' }}) | Auto-deploy de Railway con Wait for CI (ver panel de Railway) |" >> $GITHUB_STEP_SUMMARY
          echo "| Despliegue Frontend | Vercel (${{ github.ref == 'refs/heads/main' && 'Produccion' || 'Staging' }}) | ${{ needs.deploy-vercel.result == 'success' && '[OK] Desplegado' || (needs.deploy-vercel.result == 'skipped' && '[NO APLICA EN PR]' || '[FALLO]') }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Impacto en el desarrollo: La integracion continua garantiza que ningun despliegue se realice si alguna prueba unitaria, E2E o migracion no supera el 100% de aprobacion." >> $GITHUB_STEP_SUMMARY

      - name: Calcular Metricas DORA, Disponibilidad y Resiliencia
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python .github/scripts/calculate_metrics.py
