# Verifica que el grafo de migraciones tenga una sola cabeza.
#
# Con dos cabezas, `alembic upgrade head` aborta sin aplicar nada: el
# preDeployCommand falla, el despliegue se cae y el código mergeado nunca llega
# a producción. Ver AGENTS.md, sección 3.
#
# `alembic heads` solo lee alembic/versions, no abre conexión a la base de
# datos, así que este job no necesita Postgres ni secretos.

name: Alembic

on:
  # Sin filtro `paths` a propósito: como este check es obligatorio en el ruleset,
  # un PR que no dispare el job se quedaría bloqueado para siempre esperando un
  # estado que nunca llega. El job es barato, así que corre en todos los PRs.
  pull_request:
    branches: [main, develop]
  # Permite lanzarlo a mano desde la pestaña Actions, sin necesidad de un PR.
  workflow_dispatch:

  # Red de seguridad: si algo se mergea saltándose el check, avisa igual.
  push:
    branches: [main, develop]
    paths:
      - 'monorepo/backend/alembic/**'

jobs:
  una-sola-cabeza:
    name: Una sola cabeza de migraciones
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monorepo/backend
    steps:
      # Versiones fijadas igual que en ci.yml (ver el encabezado de ese archivo).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: monorepo/backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Verificar una sola cabeza
        run: |
          n=$(alembic heads | grep -c '(head)')
          if [ "$n" -ne 1 ]; then
            echo "::error::Hay $n cabezas de Alembic. Resolver antes de mergear (ver AGENTS.md, sección 3)."
            alembic heads
            exit 1
          fi
          echo "OK: una sola cabeza."
          alembic heads
